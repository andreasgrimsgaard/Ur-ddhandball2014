<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Urædd Håndball – kampføring</title>
<meta name="theme-color" content="#0b1220">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{--bg:#0b1220;--bg2:#101a2e;--sf:#141f35;--sf2:#1a2744;--ink:#EEF3FA;--mut:#8DA0BC;--ln:#25344f;--bl:#E4202D;--blt:#2a1a26;--pos:#3DDC97;--post:#12332a;--neg:#FF8A5B;--negt:#3a2218;--gl:#FFC53D;--gt:#33280f;--red:#E4202D;
box-sizing:border-box;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Barlow,system-ui,sans-serif}
body{background:radial-gradient(900px 420px at 85% -120px,rgba(228,32,45,.20),transparent 70%),radial-gradient(700px 400px at -10% 0,rgba(60,110,220,.14),transparent 70%),var(--bg);background-attachment:fixed}
body{min-height:100%}
#app{max-width:760px;margin:0 auto;padding:0 14px 40px}
header{position:sticky;top:0;background:rgba(11,18,32,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;margin:0 -14px;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--ln)}
header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:linear-gradient(100deg,var(--red) 0 38%,transparent 38%)}
.brand{display:flex;align-items:center;gap:10px}
.crest{width:40px;height:40px;border-radius:10px;background:linear-gradient(145deg,var(--red),#9d1320);display:grid;place-items:center;font:700 26px/1 "Barlow Condensed",Impact,sans-serif;color:#fff;box-shadow:0 4px 16px rgba(228,32,45,.45);transform:skewX(-6deg)}
.wm{font:700 28px/.95 "Barlow Condensed",Impact,sans-serif;letter-spacing:.06em;text-transform:uppercase}
.wm small{display:block;font:600 11px/1.2 Barlow,sans-serif;letter-spacing:.22em;color:var(--mut)}
h1{font:700 26px/1 "Barlow Condensed",Impact,sans-serif;margin:0;letter-spacing:.04em;text-transform:uppercase}
h2{font:700 20px/1.1 "Barlow Condensed",Impact,sans-serif;margin:22px 0 10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);display:flex;align-items:center;gap:10px}
h2::before{content:"";width:18px;height:4px;border-radius:2px;background:var(--red);transform:skewX(-20deg)}
.sheet h2{margin-top:14px}
nav{display:flex;gap:2px;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:3px}
nav button{border:0;background:none;color:var(--mut);font:700 14px "Barlow Condensed",sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:9px 12px;border-radius:9px;cursor:pointer}
nav button.on{background:var(--red);color:#fff;box-shadow:0 2px 10px rgba(228,32,45,.4)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gl);outline-offset:2px}
.card{background:linear-gradient(180deg,var(--sf),var(--bg2));border:1px solid var(--ln);border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.btn{border:1px solid var(--ln);background:var(--sf2);border-radius:12px;padding:11px 16px;font-weight:600;cursor:pointer;transition:transform .08s,filter .15s}
.btn:active{transform:scale(.97)}.btn:hover{filter:brightness(1.15)}
.btn.pr{background:linear-gradient(145deg,#f0303d,#c3101d);border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(228,32,45,.35)}
.btn.dg{color:var(--neg);border-color:var(--neg)}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=number],input[type=password],select{border:1px solid var(--ln);background:var(--bg2);border-radius:12px;padding:11px 12px;min-width:0}
label.f{display:block;font-weight:600;margin-bottom:4px}
.muted{color:var(--mut)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.clock{font:700 44px/1 "Barlow Condensed",Impact,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.score{font:700 30px/1 "Barlow Condensed",Impact,sans-serif;color:var(--gl)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pl{display:flex;align-items:center;gap:10px;text-align:left;background:linear-gradient(160deg,var(--sf2),var(--sf));border:1px solid var(--ln);border-radius:14px;padding:10px 12px;cursor:pointer;min-height:68px;position:relative;overflow:hidden}
.pl::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ln)}
.pl[data-z="on"]::before{background:var(--red)}.pl[data-z="on"]{border-color:#4a2a3a}
.pl .no{font:700 36px/1 "Barlow Condensed",Impact,sans-serif;color:#fff;min-width:38px;text-align:center;font-style:italic}
.pl .nm{font-weight:600;line-height:1.15}
.pl small{display:block;color:var(--mut);font-weight:400}
.sheet{position:fixed;inset:0;background:rgba(4,8,16,.72);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet>div{background:var(--sf);border:1px solid var(--ln);border-bottom:0;width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px))}
.evs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.ev{border:1px solid var(--ln);border-radius:12px;padding:12px 10px;text-align:left;cursor:pointer;background:var(--bg2);display:flex;gap:10px;align-items:center}
.ev b,.code{font:700 20px/1 "Barlow Condensed",Impact,sans-serif;min-width:34px}
.ev.p b,.code.p{color:var(--pos)}.ev.n b,.code.n{color:var(--neg)}
.ev.g{background:var(--gt);border-color:var(--gl)}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:56px 40px 1fr;gap:8px;align-items:baseline;padding:9px 12px;border-left:4px solid var(--ln);background:var(--sf);margin-bottom:5px;border-radius:0 12px 12px 0}
.tl li.p{border-left-color:var(--pos)}.tl li.n{border-left-color:var(--neg)}.tl li.g{border-left-color:var(--gl);background:var(--gt)}
.tl time{font-variant-numeric:tabular-nums;color:var(--mut)}
.tl.live li{grid-template-columns:56px 40px 1fr auto;align-items:center}
.tl.live .btn{padding:7px 12px}
.tl li.mk{border-left-color:var(--bl);background:var(--blt);font-weight:600}
.tl em{display:block;font-style:normal;color:var(--mut);font-size:14px}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:480px}
th,td{padding:7px 6px;text-align:center;border-bottom:1px solid var(--ln)}
th:first-child,td:first-child{text-align:left}
th{font:700 16px "Barlow Condensed",sans-serif}
td.z{color:var(--ln)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:30;display:none;font-weight:600}
.chk{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--ln);border-radius:12px;background:var(--sf)}
.chk input,.li input[type=checkbox]{accent-color:var(--red)}
.chk input{width:20px;height:20px}
.li{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln)}
.board{position:relative;overflow:hidden;border-radius:20px;padding:16px 14px 14px;margin:12px 0;background:linear-gradient(135deg,#0f1c38 0%,#0b1220 55%,#1b0d16 100%);border:1px solid #2b3d63;box-shadow:0 12px 34px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06)}
.board::before{content:"";position:absolute;right:-60px;top:-40px;width:220px;height:260px;background:var(--red);opacity:.14;transform:skewX(-22deg)}
.bhead{display:flex;justify-content:space-between;align-items:center;gap:8px;font:600 12px/1 Barlow,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);position:relative}
.bhead .ph{color:#fff;background:var(--red);padding:5px 9px;border-radius:6px;letter-spacing:.14em}
.bmain{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;margin-top:10px;position:relative}
.team{text-align:center;min-width:0}
.team small{display:block;font:700 16px/1.1 "Barlow Condensed",Impact,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#cfd9ea;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team.home small{color:#fff}
.team b{display:block;font:700 76px/1 "Barlow Condensed",Impact,sans-serif;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 0 28px rgba(255,255,255,.18)}
.team.home b{color:var(--gl);text-shadow:0 0 30px rgba(255,197,61,.45)}
.mid{text-align:center}.mid .clock{font-size:40px;color:#fff}
.mid .len{font:600 11px/1 Barlow,sans-serif;letter-spacing:.18em;color:var(--mut);text-transform:uppercase;margin-top:4px}
.og{font-weight:700;border-color:var(--neg);color:var(--neg)}
.clock small{display:block;font:600 13px/1.2 Barlow,sans-serif;color:var(--neg);margin:4px 0 0;letter-spacing:0}
.tl li.sub{border-left-color:var(--mut)}
.sheet>div{max-height:88vh;overflow:auto}
.pl{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.pl.dragging{opacity:.35}.pl.over{outline:3px solid var(--gl);background:var(--gt)}.ghost{position:fixed;z-index:50;pointer-events:none;opacity:.92;box-shadow:0 8px 24px rgba(0,0,0,.3);transform:scale(1.04)}
.badge{display:inline-block;font:700 12px/1 Barlow,sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border-radius:6px;background:var(--sf2);border:1px solid var(--ln);color:var(--mut)}
.ok{color:var(--pos);margin:6px 0;font-weight:600}
.urow{padding:12px 0;border-bottom:1px solid var(--ln)}.urow:last-child{border-bottom:0}.urow .row{margin-top:8px}
nav{max-width:100%;overflow-x:auto}
.lg{max-width:400px;margin:40px auto}
.lg .brand{justify-content:center}.err{color:var(--neg);min-height:1.4em;margin:6px 0}.qr{width:200px;height:200px;background:#fff;padding:8px;border-radius:8px;display:block;margin:10px auto}
@media print{header,.noprint{display:none!important}:root{--bg:#fff;--bg2:#fff;--sf:#fff;--sf2:#fff;--ink:#111;--mut:#555;--ln:#ccc;--gt:#fff3d6;--blt:#eee}body{background:#fff!important;color:#111}.card{box-shadow:none;background:#fff}h2{color:#111}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script>
// FYLL INN fra Supabase: Project Settings > API (bruk publishable-nøkkelen, aldri service_role)
const SB_URL="https://xliacezvogmnlsiwnfrd.supabase.co",SB_KEY="sb_publishable_W-_gqMOQ1UXTsU-u33tiOQ_QJVtRrtF";
const EV=[["M","Mål","p"],["SM","Straffemål","p"],["A","Assist","p"],["A+","Angrepsinitiativ","p"],["D+","Defensivt initiativ","p"],["FP","Feilpasning","n"],["MF","Mottaksfeil","n"],["D-","Defensiv feil","n"],["U","Utvisning","n"],["SB","Straffebom","n"]];
const T=id=>id==="_opp"?{id,c:"MM",n:"Mål mot",k:"n",g:false}:(db.evs.find(x=>x.id===id)||{id,c:id,n:id,k:"n",g:false});
const KIND=new Proxy({},{get:(_,id)=>T(id).k});
const isG=id=>T(id).g;
let db={players:[],match:null,history:[]};
const SB=supabase.createClient(SB_URL,SB_KEY);
let st=null;
const save=()=>{clearTimeout(st);st=setTimeout(async()=>{const {error}=await SB.from("team_data").upsert({id:1,data:db});if(error)toast("Kunne ikke lagre: "+error.message)},500)};
function norm(){
if(!db.evs)db.evs=EV.map(e=>({id:e[0],c:e[0],n:e[1],k:e[2],g:e[0]==="M"||e[0]==="SM"}));
if(db.match){db.match.marks=db.match.marks||{};if(!db.match.phase)db.match.phase=(db.match.running||db.match.elapsed)?"h1":"pre"}
}
const PH={pre:"Før kampen",h1:"1. omgang",ht:"Pause",h2:"2. omgang",ft:"Kampen er over"};
const PB=m=>{const x={pre:["ph1","Start 1. omgang"],h1:["pe1","Avslutt 1. omgang"],ht:["ph2","Start 2. omgang"],h2:["pe2","Avslutt 2. omgang og kamp"],ft:["end","Avslutt kamp"]}[m.phase];return `<button class="btn ${m.phase==="ft"?"dg":"pr"}" data-a="${x[0]}">${x[1]}</button>`};
let tab="match",sel=null,opp="",pick=null,rep=null,arm=false,dlg=null,mlen=null,stp=null,swp=null,ulist=null,umsg=null,uarm=null,uedit=null,role=null,me=null,rview="one",agg=null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LEN=m=>(m.len||30)*60000;
const raw=m=>m.elapsed+(m.running?Date.now()-m.startedAt:0);
const cap=m=>(m.phase==="pre"||m.phase==="h1")?LEN(m):(m.phase==="h2"||m.phase==="ft")?2*LEN(m):null;
const cur=m=>{const r=raw(m),c=cap(m);return c==null?r:Math.min(r,c)};
const over=m=>{const c=cap(m);return c==null?0:Math.max(0,raw(m)-c)};
const court=m=>{let c=[...(m.starters||[])];(m.subs||[]).forEach(x=>{c=c.filter(i=>i!==x.o);c.push(x.i)});return c};
function PT(m,live){
 const mk=m.marks||{},c=live?cur(m):m.elapsed,a=mk.h1e!==undefined?mk.h1e:c;
 const W=mk.h2s!==undefined?[[0,a],[mk.h2s,mk.h2e!==undefined?mk.h2e:c]]:[[0,a]];
 const on={},seg=[];(m.starters||[]).forEach(id=>on[id]=0);
 (m.subs||[]).forEach(x=>{if(on[x.o]!==undefined){seg.push([x.o,on[x.o],x.t]);delete on[x.o]}on[x.i]=x.t});
 Object.keys(on).forEach(id=>seg.push([id,on[id],Infinity]));
 const r={};seg.forEach(([id,s0,e0])=>{W.forEach(([w0,w1])=>{const d=Math.min(e0,w1)-Math.max(s0,w0);if(d>0)r[id]=(r[id]||0)+d})});
 return r}
const otx=m=>over(m)>0?"+"+fmt(over(m))+" over tid":"";
const fmt=ms=>{const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
const toast=t=>{const e=document.getElementById("toast");e.textContent=t;e.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display="none",1800)};
const goals=m=>m.events.filter(e=>isG(e.e)).length;
const oppG=m=>m.events.filter(e=>e.e==="_opp").length;
const hs=(m,h)=>{const f=e=>(e.h||1)===h;return m.events.filter(e=>isG(e.e)&&f(e)).length+"–"+m.events.filter(e=>e.e==="_opp"&&f(e)).length};
const pn=(m,id)=>{if(id===null)return m.opp||"Motstander";const p=m.squad.find(x=>x.id===id);return p?(p.no?"#"+p.no+" ":"")+p.name:"Ukjent"};

function TBL(ms){
 const used=new Set(ms.flatMap(m=>m.events.map(e=>e.e)));
 const cols=db.evs.filter(d=>!d.x||used.has(d.id));
 const P={};
 ms.forEach(m=>{m.squad.forEach(p=>{P[p.id]=P[p.id]||{n:pn(m,p.id),no:+p.no||999,k:0,c:{}};P[p.id].k++});m.events.forEach(e=>{const r=P[e.p];if(r)r.c[e.e]=(r.c[e.e]||0)+1});const t=PT(m,false);Object.keys(t).forEach(id=>{if(P[id])P[id].t=(P[id].t||0)+t[id]})});
 const rows=Object.values(P).filter(r=>Object.keys(r.c).length||r.t>0).sort((a,b)=>a.no-b.no);
 const ht=rows.some(r=>r.t>0);const tot={};rows.forEach(r=>cols.forEach(d=>tot[d.id]=(tot[d.id]||0)+(r.c[d.id]||0)));
 const mu=ms.length>1;
 return `<table><tr><th>Spiller</th>${mu?"<th>K</th>":""}${ht?"<th>Tid</th>":""}${cols.map(d=>`<th title="${esc(d.n)}">${esc(d.c)}</th>`).join("")}</tr>${rows.map(r=>`<tr><td>${esc(r.n)}</td>${mu?`<td>${r.k}</td>`:""}${ht?`<td>${r.t?fmt(r.t):"·"}</td>`:""}${cols.map(d=>r.c[d.id]?`<td><b>${r.c[d.id]}</b></td>`:'<td class="z">·</td>').join("")}</tr>`).join("")}<tr><td><b>Sum</b></td>${mu?"<td></td>":""}${ht?"<td></td>":""}${cols.map(d=>`<td><b>${tot[d.id]||0}</b></td>`).join("")}</tr></table>`;
}

function VA(){
 const L=db.history;
 if(!L.length)return `<div class="card muted">Ingen ferdige kamper ennå.</div>`;
 if(!agg)agg=new Set(L.map(x=>x.id));
 const ms=L.filter(x=>agg.has(x.id));
 return `<h2>Velg kamper</h2><div class="row noprint" style="margin-bottom:8px"><button class="btn" data-a="agall">Alle</button><button class="btn" data-a="agnone">Ingen</button></div><div class="grid">${L.slice().reverse().map(x=>`<label class="chk"><input type="checkbox" data-a="ag" data-v="${x.id}" ${agg.has(x.id)?"checked":""}><span>${esc(x.date)} · Urædd – ${esc(x.opp||"motstander")}<br><small class="muted">${goals(x)}–${oppG(x)}</small></span></label>`).join("")}</div>
 <h2>Samlet statistikk</h2><div class="card"><b style="font-size:20px">${ms.length} kamper</b> <span class="muted">· mål for–mot: ${ms.reduce((s,x)=>s+goals(x),0)}–${ms.reduce((s,x)=>s+oppG(x),0)} · ${ms.reduce((s,x)=>s+x.events.filter(e=>e.e!=="_opp").length,0)} hendelser</span></div>${ms.length?`<div class="card sc">${TBL(ms)}</div>`:""}<div class="row noprint"><button class="btn" data-a="print">Skriv ut</button><button class="btn dg" data-a="delsel" ${ms.length?"":"disabled"}>${arm?"Trykk igjen for å slette":"Slett valgte ("+ms.length+")"}</button></div>`;
}

function VE(){
 const opt=k=>`<option value="p" ${k==="p"?"selected":""}>Positiv</option><option value="n" ${k==="n"?"selected":""}>Negativ</option>`;
 return `<h2>Hendelser</h2><div class="card"><div class="row"><input type="text" id="ec" placeholder="Kode" style="width:84px"><input type="text" id="en" placeholder="Navn" style="flex:1 1 160px"><select id="ek">${opt("p")}</select></div><div class="row" style="margin-top:8px"><label class="row"><input type="checkbox" id="eg"> Teller som mål</label><button class="btn pr" data-a="adde">Legg til hendelse</button></div></div>
 <div class="card">${db.evs.filter(d=>!d.x).map(d=>`<div class="li" style="gap:6px;flex-wrap:wrap"><input type="text" value="${esc(d.c)}" data-eid="${d.id}" data-f="c" style="width:70px"><input type="text" value="${esc(d.n)}" data-eid="${d.id}" data-f="n" style="flex:1 1 140px"><select data-eid="${d.id}" data-f="k">${opt(d.k)}</select><label class="row"><input type="checkbox" data-eid="${d.id}" data-f="g" ${d.g?"checked":""}> Mål</label><button class="btn dg" data-a="deld" data-v="${d.id}">Fjern</button></div>`).join("")}</div><p class="muted">Endringer lagres med en gang og gjelder også i tidligere rapporter. Fjernede hendelser forsvinner fra knappene, men gamle registreringer beholdes.</p>`;
}

function VU(){
 const ad=role==="admin";
 const msg=umsg?`<div class="${umsg.t==="ok"?"ok":"err"}" role="status">${esc(umsg.x)}</div>`:"";
 let h=`<h2>Min konto</h2>${msg}<div class="card"><div class="muted">Innlogget som</div><b>${esc(me?me.email:"")}</b> <span class="badge">${ad?"Administrator":"Standard"}</span><div class="row" style="margin-top:12px"><input type="password" id="mypw" placeholder="Nytt passord (minst 8 tegn)" autocomplete="new-password" style="flex:1 1 200px"><button class="btn" data-a="mypw">Bytt passord</button></div></div>`;
 if(!ad)return h;
 h+=`<h2>Legg til bruker</h2><div class="card"><div class="row"><input type="text" id="ne" placeholder="E-post" inputmode="email" autocomplete="off" style="flex:1 1 220px"><input type="text" id="np" placeholder="Passord" autocomplete="off" style="flex:1 1 160px"><button class="btn" data-a="ugen">Lag passord</button></div><div class="row" style="margin-top:8px"><select id="nr"><option value="standard">Standard</option><option value="admin">Administrator</option></select><button class="btn pr" data-a="uadd">Opprett bruker</button></div><p class="muted" style="margin:10px 0 0;font-size:14px">Brukeren logger inn med e-post og passordet, og setter opp tofaktor første gang. Gi dem passordet på en trygg måte.</p></div>

 }

 let h=`<div class="board"><div class="bhead"><span class="ph">${PH[m.phase]}</span><span>Håndball gutter</span></div><div class="bmain" aria-label="Stilling"><div class="team home"><small>Urædd</small><b>${goals(m)}</b></div><div class="mid"><div class="clock"><span id="clk">${fmt(cur(m))}</span><small id="ot">${otx(m)}</small></div><div class="len">2 × ${m.len||30} min</div></div><div class="team"><small>${esc(m.opp||"Motstander")}</small><b>${oppG(m)}</b></div></div></div>
 <div class="card" style="margin-top:0"> <div class="row" style="margin-top:10px"><button class="btn og" data-a="oppg">+ Mål til ${esc(m.opp||"motstander")}</button><button class="btn" data-a="swap">⇄ Bytte</button>${PB(m)}${m.phase==="h1"||m.phase==="h2"?`<button class="btn" data-a="clock">${m.running?"Pause klokka":"Start klokka"}</button>`:""}<button class="btn" data-a="undo" ${m.events.length?"":"disabled"}>Angre siste</button></div></div>
 <p class="muted" style="margin:6px 0 0;font-size:14px">Tips: hold inne og dra en spiller over en annen (benk ↔ bane) for å bytte.</p><h2>På banen (${on.length} av ${m.len===20?6:7})</h2><div class="grid">${on.map(p=>TILE(p,"on")).join("")}</div><h2>Benk (${bn.length})</h2><div class="grid">${bn.map(p=>TILE(p,"bn")).join("")}</div>`;
 h+=`<h2>Registrerte hendelser</h2>`+(m.events.length?`<ul class="tl live">${m.events.map((e,i)=>({e,i})).reverse().map(({e,i})=>`<li class="${isG(e.e)?"g":KIND[e.e]}"><time>${fmt(e.t)}</time><b class="code ${KIND[e.e]}">${esc(T(e.e).c)}</b><span>${esc(pn(m,e.p))}<em>${esc(T(e.e).n)}</em></span><button class="btn dg" data-a="dele" data-v="${i}" aria-label="Slett hendelse">Slett</button></li>`).join("")}</ul>`:'<div class="card muted">Ingen hendelser ennå. Trykk på en spiller for å registrere.</div>');
 h+=(m.subs&&m.subs.length?`<h2>Bytter</h2><ul class="tl live">${m.subs.map((x,i)=>({x,i})).reverse().map(({x,i})=>`<li class="sub"><time>${fmt(x.t)}</time><b class="code">⇄</b><span>${esc(pn(m,x.o))} ut<em>${esc(pn(m,x.i))} inn</em></span><button class="btn dg" data-a="dels" data-v="${i}">Slett</button></li>`).join("")}</ul>`:"");
 if(swp){const L=(arr,k,c)=>arr.map(p=>`<button class="ev ${c===p.id?"g":""}" data-a="${k}" data-v="${p.id}"><b>${esc(p.no||"–")}</b><span>${esc(p.name)}</span></button>`).join("")||'<span class="muted">Ingen</span>';

  h+=`<div class="sheet" data-a="close"><div><div class="bar"><b style="font-size:20px">${esc(pn(m,sel))}</b><button class="btn" data-a="close">Lukk</button></div><div class="evs">${db.evs.filter(d=>!d.x).map(d=>`<button class="ev ${d.k} ${d.g?"g":""}" data-a="ev" data-v="${d.id}"><b>${esc(d.c)}</b><span>${esc(d.n)}</span></button>`).join("")}</div></div></div>`;}
 if(dlg){const q=dlg==="pe1"?["Avslutte 1. omgang?","Klokka stoppes. 2. omgang starter på "+(m.len||30)+":00.","Avslutt 1. omgang"]:["Avslutte 2. omgang og kampen?","Kampen lagres, og du får rapporten. Stillingen er "+goals(m)+"–"+oppG(m)+".","Avslutt omgang og kamp"];
  h+=`<div class="sheet" data-a="dno"><div role="dialog" aria-modal="true"><h2 style="margin-top:0">${q[0]}</h2><p class="muted">${q[1]}</p><div class="row"><button class="btn pr" data-a="dyes">${q[2]}</button><button class="btn" data-a="dno">Avbryt</button></div></div></div>`}
 return h;

function VR1(){
 const L=db.history;
 if(!L.length)return `<h2>Rapport</h2><div class="card muted">Ingen ferdige kamper ennå. Rapporten dukker opp her når du avslutter en kamp.</div>`;
 const m=L.find(x=>x.id===rep)||L[L.length-1];
 const mk=m.marks||{},tot=mk.h2s>0?m.elapsed:(mk.h1e||0)+m.elapsed;
 const ev=[...m.events.map(e=>({...e,h:e.h||1})),...(m.subs||[]).map(x=>({sub:1,out:x.o,inn:x.i,h:x.h,t:x.t})),...[["h1s","Start 1. omgang",1,-1],["h1e","Slutt 1. omgang",1,9e12],["h2s","Start 2. omgang",2,-1],["h2e","Slutt 2. omgang",2,9e12]].filter(x=>mk[x[0]]!==undefined).map(x=>({mark:x[1],h:x[2],t:x[3],tm:mk[x[0]]}))].sort((a,b)=>(a.h-b.h)||(a.t-b.t));
 let sa=0,sb=0;ev.forEach(e=>{if(e.mark||e.sub)return;if(e.e==="_opp"){sb++;e.sc=sa+"–"+sb}else if(isG(e.e)){sa++;e.sc=sa+"–"+sb}});
 return `<h2>Rapport</h2><div class="card"><div class="row noprint"><select id="rsel">${L.slice().reverse().map(x=>`<option value="${x.id}" ${x.id===m.id?"selected":""}>${esc(x.date)} · Urædd – ${esc(x.opp||"motstander")}</option>`).join("")}</select><button class="btn" data-a="print">Skriv ut</button><button class="btn dg" data-a="delr" data-v="${m.id}">${arm?"Trykk igjen for å slette":"Slett rapport"}</button></div>
 <div style="margin-top:10px"><b style="font-size:24px;font-family:'Barlow Condensed',sans-serif;letter-spacing:.06em;text-transform:uppercase">Urædd – ${esc(m.opp||"motstander")}</b> <span class="muted">${esc(m.date)} · ${fmt(tot)} spilt (2×${m.len||30} min) · <b>${goals(m)}–${oppG(m)}</b> (1. omgang ${hs(m,1)}, 2. omgang ${hs(m,2)}) · ${m.events.filter(e=>e.e!=="_opp").length} hendelser</span></div></div>
 <h2>Tidslinje</h2>${ev.length?`<ul class="tl">${ev.map(e=>e.sub?`<li class="sub"><time>${fmt(e.t)}</time><b class="code">⇄</b><span>${esc(pn(m,e.out))} ut<em>${esc(pn(m,e.inn))} inn</em></span></li>`:e.mark?`<li class="mk"><time>${fmt(e.tm)}</time><b></b><span>${e.mark}</span></li>`:`<li class="${isG(e.e)?"g":KIND[e.e]}"><time>${fmt(e.t)}</time><b class="code ${KIND[e.e]}">${esc(T(e.e).c)}</b><span>${esc(pn(m,e.p))}<em>${esc(T(e.e).n)}${e.sc?" · stilling "+e.sc:""}</em></span></li>`).join("")}</ul>`:'<div class="card muted">Ingen hendelser registrert.</div>'}
 <h2>Per spiller</h2><div class="card sc">${TBL([m])}</div>`;
}

document.addEventListener("click",ev=>{
 if(Date.now()<noClick)return;const t=ev.target.closest("[data-a]");if(!t)return;
 if(t.classList.contains("sheet")&&ev.target!==t)return;
 const a=t.dataset.a,v=t.dataset.v,m=db.match;
 if(a==="tab"){tab=v;sel=null;arm=false;dlg=null;swp=null;uarm=null;uedit=null;if(v==="users"){umsg=null;loadUsers()}}
 else if(a==="addp"){const n=document.getElementById("pn").value.trim(),no=document.getElementById("pno").value.trim();if(!n){toast("Skriv inn et navn");return}
  db.players.push({id:"p"+Date.now(),name:n,no});save()}
 else if(a==="delp"){db.players=db.players.filter(p=>p.id!==v);pick=null;stp=null;save()}
 else if(a==="pk"){if(pick.has(v)){pick.delete(v);stp.delete(v)}else pick.add(v)}
 else if(a==="st"){if(stp.has(v))stp.delete(v);else{stp.add(v);pick.add(v)}}
 else if(a==="start"){db.match={id:"m"+Date.now(),opp:(document.getElementById("opp")||{}).value||opp,date:new Date().toLocaleDateString("nb-NO"),squad:db.players.filter(p=>pick.has(p.id)),events:[],elapsed:0,running:false,startedAt:0,phase:"pre",marks:{},len:(mlen=mlen||db.lastLen||20),starters:[...stp],subs:[]};opp="";pick=null;stp=null;db.lastLen=db.match.len;save()}
 else if(a==="clock"){if(m.running){m.elapsed=cur(m);m.running=false}else{m.startedAt=Date.now();m.running=true}save()}
 else if(a==="sel"){sel=v}
 else if(a==="close"){sel=null}
 else if(a==="ev"){m.events.push({t:cur(m),p:sel,e:v,h:(m.phase==="ht"||m.phase==="h2"||m.phase==="ft")?2:1});toast(T(v).c+" · "+pn(m,sel)+" · "+fmt(cur(m)));sel=null;save()}
 else if(a==="dele"){m.events.splice(+v,1);toast("Hendelse slettet");save()}
 else if(a==="rv"){rview=v}
 else if(a==="ag"){agg.has(v)?agg.delete(v):agg.add(v)}
 else if(a==="agall"){agg=new Set(db.history.map(x=>x.id))}
 else if(a==="agnone"){agg=new Set()}
 else if(a==="adde"){const c=document.getElementById("ec").value.trim(),n=document.getElementById("en").value.trim();if(!c||!n){toast("Fyll inn kode og navn");return}db.evs.push({id:"e"+Date.now(),c,n,k:document.getElementById("ek").value,g:document.getElementById("eg").checked});save()}
 else if(a==="deld"){const d=db.evs.find(x=>x.id===v);if(d)d.x=true;save()}
 else if(a==="out"){SB.auth.signOut().then(()=>location.reload());return}
 else if(a==="oppg"){m.events.push({t:cur(m),p:null,e:"_opp",h:(m.phase==="ht"||m.phase==="h2"||m.phase==="ft")?2:1});toast("Mål mot · stilling "+goals(m)+"–"+oppG(m));save()}
 else if(a==="delr"||a==="delsel"){if(!arm){arm=true;R();setTimeout(()=>{arm=false;R()},4000);return}
  const ids=a==="delr"?[v]:[...agg];db.history=db.history.filter(x=>!ids.includes(x.id));rep=null;if(agg)ids.forEach(i=>agg.delete(i));arm=false;save();toast(ids.length+(ids.length>1?" rapporter":" rapport")+" slettet")}
 else if(a==="swap"){swp={o:null,i:null}}
 else if(a==="sno"){swp=null}
 else if(a==="so"){swp.o=swp.o===v?null:v}
 else if(a==="si"){swp.i=swp.i===v?null:v}
 else if(a==="sok"){if(swp&&swp.o&&swp.i){m.subs=m.subs||[];m.subs.push({t:cur(m),h:(m.phase==="ht"||m.phase==="h2"||m.phase==="ft")?2:1,o:swp.o,i:swp.i});toast("Bytte: "+pn(m,swp.o)+" ut, "+pn(m,swp.i)+" inn");swp=null;save()}}
 else if(a==="dels"){m.subs.splice(+v,1);toast("Bytte slettet");save()}
 else if(a==="mypw"){const pw=document.getElementById("mypw").value;
  if(pw.length<8){umsg={t:"err",x:"Passordet må ha minst 8 tegn."}}
  else{SB.auth.updateUser({password:pw}).then(({error})=>{umsg=error?{t:"err",x:"Kunne ikke bytte passord: "+error.message}:{t:"ok",x:"Passordet er endret."};R()});return}}
 else if(a==="ugen"){document.getElementById("np").value=gen();return}
 else if(a==="ugen2"){document.getElementById("upw").value=gen();return}
 else if(a==="uadd"){const em=document.getElementById("ne").value.trim(),pw=document.getElementById("np").value,r=document.getElementById("nr").value;
  if(!em||pw.length<8){umsg={t:"err",x:"Fyll inn e-post og et passord på minst 8 tegn."}}
  else{adm({action:"create",email:em,password:pw,role:r}).then(()=>{umsg={t:"ok",x:"Bruker "+em+" er opprettet. Gi dem passordet; de setter opp tofaktor ved første innlogging."};return loadUsers()}).catch(x=>{umsg={t:"err",x:x.message};R()});return}}
 else if(a==="upwe"){uedit=v;uarm=null}
 else if(a==="upwc"){uedit=null}
 else if(a==="upws"){const pw=document.getElementById("upw").value;
  if(pw.length<8){umsg={t:"err",x:"Passordet må ha minst 8 tegn."}}
  else{adm({action:"setPassword",id:v,password:pw}).then(()=>{uedit=null;umsg={t:"ok",x:"Passordet er endret. Gi det nye passordet til brukeren."};R()}).catch(x=>{umsg={t:"err",x:x.message};R()});return}}
 else if(a==="udel"||a==="u2fa"){const k=a+":"+v;
  if(uarm!==k){uarm=k;R();setTimeout(()=>{if(uarm===k){uarm=null;R()}},4000);return}
  uarm=null;adm({action:a==="udel"?"delete":"reset2fa",id:v}).then(()=>{umsg={t:"ok",x:a==="udel"?"Bruker slettet.":"Tofaktor nullstilt. Brukeren setter opp ny ved neste innlogging."};return loadUsers()}).catch(x=>{umsg={t:"err",x:x.message};R()});return}
 else if(a==="undo"){const e=m.events.pop();if(e)toast("Angret "+e.e);save()}
 else if(a==="ph1"||a==="ph2"){const f=a==="ph1";m.marks[f?"h1s":"h2s"]=cur(m);m.phase=f?"h1":"h2";m.startedAt=Date.now();m.running=true;save()}
 else if(a==="pe1"||a==="pe2"||a==="end"){dlg=a}

  save()}
 else if(a==="print"){window.print();return}
 R();
});

function subst(o,i){const m=db.match;if(!m)return;m.subs=m.subs||[];m.subs.push({t:cur(m),h:(m.phase==="ht"||m.phase==="h2"||m.phase==="ft")?2:1,o,i});toast("Bytte: "+pn(m,o)+" ut, "+pn(m,i)+" inn");save();R()}
function dGhost(x,y){const r=dg.el.getBoundingClientRect(),g=dg.el.cloneNode(true);g.classList.add("ghost");g.removeAttribute("data-a");g.style.width=r.width+"px";g.style.left=(x-r.width/2)+"px";g.style.top=(y-r.height/2)+"px";document.body.appendChild(g);dg.g=g;dg.w=r.width;dg.h=r.height;dg.el.classList.add("dragging")}
function dTarget(x,y,d){const e=document.elementFromPoint(x,y),t=e&&e.closest?e.closest(".pl[data-v]"):null;return t&&t.dataset.v!==d.id&&t.dataset.z!==d.el.dataset.z?t:null}
function dMove(x,y){const g=dg.g;g.style.left=(x-dg.w/2)+"px";g.style.top=(y-dg.h/2)+"px";document.querySelectorAll(".pl.over").forEach(e=>e.classList.remove("over"));const t=dTarget(x,y,dg);if(t)t.classList.add("over")}
function dEnd(x,y){if(!dg)return;clearTimeout(dg.tm);const d=dg;dg=null;if(!d.on)return;noClick=Date.now()+500;
 const t=d.g?dTarget(x,y,d):null;if(d.g)d.g.remove();
 d.el.classList.remove("dragging");document.querySelectorAll(".pl.over").forEach(e=>e.classList.remove("over"));
 if(t){const a=d.el.dataset.z==="on"?[d.id,t.dataset.v]:[t.dataset.v,d.id];subst(a[0],a[1])}}
const dOk=el=>el&&db.match&&tab==="match"&&!sel&&!swp&&!dlg;
const dTile=e=>e.target.closest?e.target.closest(".pl[data-v]"):null;
document.addEventListener("touchstart",e=>{const el=dTile(e);if(!dOk(el)||e.touches.length!==1)return;const t=e.touches[0];
 dg={id:el.dataset.v,el,x0:t.clientX,y0:t.clientY,on:false,tm:setTimeout(()=>{if(dg&&!dg.on){dg.on=true;dGhost(dg.x0,dg.y0);if(navigator.vibrate)navigator.vibrate(15)}},320)}},{passive:true});
document.addEventListener("touchmove",e=>{if(!dg)return;const t=e.touches[0];
 if(!dg.on){if(Math.hypot(t.clientX-dg.x0,t.clientY-dg.y0)>8){clearTimeout(dg.tm);dg=null}return}
 if(e.cancelable)e.preventDefault();dMove(t.clientX,t.clientY)},{passive:false});
document.addEventListener("touchend",e=>{const t=e.changedTouches[0];dEnd(t.clientX,t.clientY)});
document.addEventListener("touchcancel",()=>{if(dg){clearTimeout(dg.tm);if(dg.g)dg.g.remove();dg.el.classList.remove("dragging");document.querySelectorAll(".pl.over").forEach(e=>e.classList.remove("over"));dg=null}});
document.addEventListener("mousedown",e=>{if(e.button!==0)return;const el=dTile(e);if(!dOk(el))return;dg={id:el.dataset.v,el,x0:e.clientX,y0:e.clientY,on:false}});
document.addEventListener("mousemove",e=>{if(!dg||dg.tm)return;if(!dg.on){if(Math.hypot(e.clientX-dg.x0,e.clientY-dg.y0)>6){dg.on=true;dGhost(e.clientX,e.clientY)}else return}dMove(e.clientX,e.clientY)});
document.addEventListener("mouseup",e=>{if(dg&&!dg.tm)dEnd(e.clientX,e.clientY)});
document.addEventListener("contextmenu",e=>{if(dTile(e))e.preventDefault()});

const gen=()=>{const c="abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789",a=new Uint32Array(14);crypto.getRandomValues(a);return Array.from(a,x=>c[x%c.length]).join("")};
async function adm(body){
 const {data,error}=await SB.functions.invoke("admin-users",{body});
 if(error){let m=error.message;try{const j=await error.context.json();if(j&&j.error)m=j.error}catch(e){}throw new Error(m)}
 if(data&&data.error)throw new Error(data.error);return data}
async function loadUsers(){
 if(role!=="admin"){R();return}
 const {data,error}=await SB.from("profiles").select("id,email,role,created_at").order("email");
 if(error){ulist=[];umsg={t:"err",x:"Kunne ikke hente brukere: "+error.message}}else ulist=data;
 R()}
const A=()=>document.getElementById("app");
const box=h=>{A().innerHTML=`<div class="card lg"><div class="brand" style="margin-bottom:12px"><div class="crest">U</div><div class="wm">Urædd<small>Håndball gutter · kampføring</small></div></div>${h}</div>`};
function LOGIN(msg,em){
 box(`<p class="muted">Logg inn for å fortsette.</p><div id="lf"><label class="f" for="lu">Brukernavn (e-post)</label><input type="text" id="lu" value="${esc(em||"")}" autocomplete="username" inputmode="email" style="width:100%"><label class="f" for="lp" style="margin-top:10px">Passord</label><input type="password" id="lp" autocomplete="current-password" style="width:100%"><div class="err" role="alert">${esc(msg||"")}</div><button class="btn pr" id="lb" type="button">Logg inn</button></div>`);
 const go=async()=>{const em=document.getElementById("lu").value.trim(),b=document.getElementById("lb");b.disabled=true;b.textContent="Logger inn …";
  try{const {error}=await SB.auth.signInWithPassword({email:em,password:document.getElementById("lp").value});
   if(error)return LOGIN(error.message==="Invalid login credentials"?"Feil brukernavn eller passord.":"Innlogging feilet: "+error.message,em);
   await boot()}catch(x){LOGIN("Innlogging feilet: "+x.message,em)}};
 document.getElementById("lb").onclick=go;
 document.getElementById("lf").onkeydown=e=>{if(e.key==="Enter")go()};
}
async function MFA(){
 const {data:fs,error:le}=await SB.auth.mfa.listFactors();
 if(le)return LOGIN("Kunne ikke hente tofaktor: "+le.message);
 const f=fs&&fs.totp&&fs.totp[0];
 let id,qr="";
 if(f)id=f.id;else{
  const {data,error}=await SB.auth.mfa.enroll({factorType:"totp",friendlyName:"app"+Date.now()});
  if(error)return LOGIN("Kunne ikke sette opp tofaktor: "+error.message);
  id=data.id;
  qr=`<p>Skann QR-koden med en autentiseringsapp (for eksempel Microsoft Authenticator, Google Authenticator eller Authy), og skriv inn koden appen viser.</p><img class="qr" alt="QR-kode for tofaktor" src="${data.totp.qr_code}"><p class="muted">Kan du ikke skanne? Skriv inn nøkkelen manuelt: <b>${esc(data.totp.secret)}</b></p>`}
 box(`${qr||'<p class="muted">Skriv inn den 6-sifrede koden fra autentiseringsappen.</p>'}<div id="mf"><label class="f" for="mc">Kode</label><input type="text" id="mc" inputmode="numeric" autocomplete="one-time-code" maxlength="6" style="width:100%"><div class="err" role="alert"></div><button class="btn pr" id="mb" type="button">Bekreft</button></div>`);
 const go=async()=>{try{const {error}=await SB.auth.mfa.challengeAndVerify({factorId:id,code:document.getElementById("mc").value.trim()});
  if(error){document.querySelector(".err").textContent="Feil kode, prøv igjen. ("+error.message+")";return}
  await start()}catch(x){document.querySelector(".err").textContent="Feil: "+x.message}};
 document.getElementById("mb").onclick=go;
 document.getElementById("mf").onkeydown=e=>{if(e.key==="Enter")go()};
}
async function start(){
 const {data,error}=await SB.from("team_data").select("data").eq("id",1).maybeSingle();
 if(error)return LOGIN("Kunne ikke hente data: "+error.message);
 if(data&&data.data)db=data.data;
 norm();
 try{const {data:{user}}=await SB.auth.getUser();me=user;
  const {data:pr}=await SB.from("profiles").select("role").eq("id",user.id).maybeSingle();role=pr?pr.role:null}catch(e){role=null}
 tab=(db.match||db.players.length)?"match":"players";R();
}
async function boot(){
 if(SB_URL.includes("DITT-PROSJEKT"))return box('<p class="err">Fyll inn Supabase-URL og nøkkel øverst i filen før du bruker appen.</p>');
 const {data:{session}}=await SB.auth.getSession();
 if(!session)return LOGIN();
 const {data:l}=await SB.auth.mfa.getAuthenticatorAssuranceLevel();
 if(l&&l.currentLevel==="aal2")start();else MFA();
}
boot().catch(x=>LOGIN("Feil ved oppstart: "+x.message));
</script>
